{% extends 'expenses/base.html' %}

{% block title %}Change Password - Expense Tracker{% endblock %}

{% block content %}

<h2 class="h4 mb-4">Change Password</h2>

<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Change Password</button>
                    <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% extends 'expenses/base.html' %}

{% block title %}Profile - Expense Tracker{% endblock %}

{% block content %}

<h2 class="h4 mb-4">Profile</h2>

<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
